name: Llamatron
options:
  bundleIdPrefix: com.llamatron
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Llamatron records the microphone only while you dictate, to transcribe your speech into the message box."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Llamatron uses speech recognition to turn your dictation into text. It runs on-device when your Mac supports it."
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LlamaEngine:
    path: ../LlamaEngine
targets:
  Llamatron:
    type: application
    platform: macOS
    sources:
      - path: Llamatron
        excludes:
          - "Resources/**"
      - path: Llamatron/Resources
        buildPhase: resources
    dependencies:
      - package: LlamaEngine
        product: LlamaEngine
      - package: LlamaEngine
        product: LlamaEngineStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamatron.Llamatron
        PRODUCT_NAME: Llamatron
        CODE_SIGN_ENTITLEMENTS: Llamatron/Llamatron.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LlamatronTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LlamatronTests
    dependencies:
      - target: Llamatron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamatron.LlamatronTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Llamatron:
    build:
      targets:
        Llamatron: all
    test:
      targets:
        - LlamatronTests

