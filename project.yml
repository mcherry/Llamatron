name: Llamatron
options:
  bundleIdPrefix: com.llamatron
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Llamatron records the microphone only while you dictate, to transcribe your speech into the message box."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Llamatron uses speech recognition to turn your dictation into text. It runs on-device when your Mac supports it."
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  LlamaEngine:
    path: ../LlamaEngine
targets:
  Llamatron:
    type: application
    platform: macOS
    sources:
      - path: Llamatron
        excludes:
          - "Resources/**"
          - "Info-iOS.plist"
      - path: Llamatron/Resources
        buildPhase: resources
    dependencies:
      - package: LlamaEngine
        product: LlamaEngine
      - package: LlamaEngine
        product: LlamaEngineStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamatron.Llamatron
        PRODUCT_NAME: Llamatron
        CODE_SIGN_ENTITLEMENTS: Llamatron/Llamatron.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Llamatron-iOS:
    type: application
    platform: iOS
    sources:
      - path: Llamatron
        excludes:
          - "Resources/**"
          - "Info-iOS.plist"
      - path: Llamatron/Resources
        buildPhase: resources
    dependencies:
      - package: LlamaEngine
        product: LlamaEngine
      - package: LlamaEngine
        product: LlamaEngineStore
    info:
      path: Llamatron/Info-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Llamatron records the microphone only while you dictate, to transcribe your speech into the message box."
        NSSpeechRecognitionUsageDescription: "Llamatron uses speech recognition to turn your dictation into text. It runs on-device when your iPad supports it."
        NSLocalNetworkUsageDescription: "Llamatron connects to a local LLM server (such as Ollama or llama.cpp) running on your network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamatron.Llamatron
        PRODUCT_NAME: Llamatron
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LlamatronTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LlamatronTests
    dependencies:
      - target: Llamatron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamatron.LlamatronTests
        GENERATE_INFOPLIST_FILE: YES
  LlamatronUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LlamatronUITests
    dependencies:
      - target: Llamatron-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llamatron.LlamatronUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Llamatron-iOS
schemes:
  Llamatron:
    build:
      targets:
        Llamatron: all
    test:
      targets:
        - LlamatronTests
  Llamatron-iOS:
    build:
      targets:
        Llamatron-iOS: all
    run:
      config: Debug
    test:
      targets:
        - LlamatronUITests

